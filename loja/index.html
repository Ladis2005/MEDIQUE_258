<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MEDIQUE · Uniformes médicos em Moçambique</title>
    <meta name="description" content="MEDIQUE — uniformes médicos premium em Moçambique. Scrubs e conjuntos em 15 cores, com stock em tempo real. Cuidamos de quem cuida." />
    <meta name="theme-color" content="#073B70" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MEDIQUE" />
    <meta property="og:title" content="MEDIQUE · Uniformes que cuidam de quem cuida" />
    <meta property="og:description" content="Estilo, conforto e profissionalismo em cada detalhe." />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:locale" content="pt_MZ" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Primeira fotografia da página inicial: começa a descarregar antes do JavaScript (igual a HERO_SIZES em Home.tsx). -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high"
      imagesrcset="/produtos/600/bege-frente-costas.webp 600w, /produtos/1200/bege-frente-costas.webp 1200w"
      imagesizes="(min-width: 768px) 520px, 100vw" />
    <style>
      /* Ecrã de carregamento antes do React arrancar */
      #boot{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:100;transition:opacity .4s}
      #boot img{width:64px;animation:pulse 1.4s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.35;transform:scale(.94)}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="/logo.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
